<!DOCTYPE html>
<html>
    <head>
        <title>Registro de usuario</title>
        <link rel="stylesheet" href="estilos.css">
    </head>     
    <body>
        <h1>REGISTRO DE USUARIO</h1>
        <label>Nombre:</label>
        <input type="text" id="Nombre">
        <br><br>
        <label>Apellido Paterno:</label>
        <input type="text" id="Paterno">
        <br><br>
        <label>Apellido Materno:</label>
        <input type="text" id="Materno">
        <br><br>
        <label>Telefono:</label>
        <input type="number" id="Numero">
        <br><br>
        <label>Direccion:</label>
        <input type="text" id="Direccion">
        <br><br>
        <label>Correo Electronico:</label>
        <input type="email" id="Correo">
        <br><br>
        <button onclick="registrar()">REGISTRARME</button>
        <h2>DATOS DEL ALUMNO</h2>
        <p id="resultadoNombre"></p>
        <p id="resultadoPaterno"></p>
        <p id="resultadoMaterno"></p>
        <p id="resultadoNumero"></p>
        <p id="resultadoDireccion"></p>
        <p id="resultadoCorreo"></p>

        <script src="script.js"></script>
    </body>
</html>
